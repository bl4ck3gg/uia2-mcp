plugins {
    id 'com.android.application'
}

android {
    namespace "bl4ck3gg.uia2mcp"
    compileSdk 35

    defaultConfig {
        applicationId "bl4ck3gg.uia2mcp"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "uia2-mcp.apk"
        }
    }
}

// No third-party runtime dependencies on purpose. The two this project used to
// carry -- androidx.test.uiautomator for one Configurator call, and NanoHTTPD for
// one request shape -- contributed most of the APK's bytes and none of its
// behaviour once UiDevice was dropped.
dependencies {}

